name: Architecture, persistence and tests

# Verifica en cada push y PR que los 4 scripts SQL crean el modelo de datos
# correcto: levanta PostgreSQL 16, ejecuta los scripts en orden y corre
# backend/tests/verify_db_structure.py. El workflow falla si no da 92 passed.
on:
  push:
  pull_request:

jobs:
  verify-db:
    runs-on: ubuntu-latest

    # PostgreSQL 16 como en producción (deployment/db usa postgres:16-alpine).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      USERS_DB_URL: postgresql://postgres:postgres@localhost:5432/users_db
      ASSESMENT_DB_URL: postgresql://postgres:postgres@localhost:5432/assesment_mesoftx_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente de PostgreSQL (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Los scripts usan meta-comandos de psql (\connect, \gexec), por eso se
      # ejecutan con psql y no con un cliente SQL genérico. Orden fijo 01->04.
      # ON_ERROR_STOP=1: si un script falla, el paso (y el workflow) falla.
      - name: Ejecutar los 4 scripts SQL en orden
        run: |
          cd deployment/db/scripts
          for f in 01_create_db.sql 02_create_tables_users.sql 03_create_tables_assesment.sql 04_bootstrap.sql; do
            echo "==> $f"
            psql -v ON_ERROR_STOP=1 -d postgres -f "$f"
          done

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de test
        run: pip install pytest psycopg2-binary

      # pytest devuelve != 0 si algún test falla, lo que ya haría fallar el job.
      # Además se exige explícitamente el conteo: debe ser 92 passed.
      - name: Correr verify_db_structure.py (exige 92 passed)
        run: |
          cd backend
          pytest tests/verify_db_structure.py -v | tee pytest_output.txt
          grep -qE "(^| )92 passed" pytest_output.txt \
            || (echo "ERROR: se esperaban 92 tests passed y no se cumplió." && exit 1)

  backend-security:
    # Pruebas de seguridad de cada microservicio (JWT, RBAC, límite de intentos, vista pública).
    # Se ejecutan por separado porque ambos paquetes se llaman "app".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: User_MS
        run: |
          pip install -r backend/User_MS/requirements.txt pytest httpx
          cd backend/User_MS && PYTHONPATH=. pytest ../tests/user_ms -q
      - name: Assesment_MS
        run: |
          pip install -r backend/Assesment_MS/requirements.txt pytest httpx
          cd backend/Assesment_MS && PYTHONPATH=. pytest ../tests/assesment_ms -q
      - name: Auditoría de dependencias (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/User_MS/requirements.txt --no-deps
          pip-audit -r backend/Assesment_MS/requirements.txt --no-deps

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run test:coverage && npx ng build --configuration production && npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/


  refactor-contracts-and-coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      USERS_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/users_db
      ASSESSMENT_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/assesment_mesoftx_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Initialize disposable databases and additive migrations
        run: |
          for file in deployment/db/scripts/*.sql deployment/db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -d postgres -f "$file"
          done
      - name: Test workflows, function coverage and preservation
        run: scripts/test_backend.sh
      - name: Verify OpenAPI contracts
        run: python scripts/export_contracts.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  deployment-smoke:
    runs-on: ubuntu-latest
    needs: [frontend, refactor-contracts-and-coverage]
    steps:
      - uses: actions/checkout@v4
      - name: Build release images
        run: |
          docker build -t mesoftx-refactor-db:20261025 deployment/db
          docker build -t mesoftx-refactor-user:20261025 -f deployment/backend/User_MS/Dockerfile .
          docker build -t mesoftx-refactor-assessment:20261025 -f deployment/backend/Assesment_MS/Dockerfile .
          docker build -t mesoftx-refactor-frontend:20261025 frontend
      - name: Verify isolated deployment and recovery
        run: |
          mkdir -p backend/coverage
          python3 scripts/smoke_deployment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-smoke
          path: backend/coverage/deployment-smoke.json
