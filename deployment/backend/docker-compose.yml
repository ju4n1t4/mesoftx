services:
  mesoftx-db:
    build:
      context: ../db
      dockerfile: Dockerfile
    container_name: mesoftx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mesoftx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  user-ms:
    build:
      context: ../..
      dockerfile: deployment/backend/User_MS/Dockerfile
    container_name: user-ms
    restart: unless-stopped
    environment:
      APP_NAME: User_MS
      APP_ENV: container
      API_V1_PREFIX: /api/v1
      DATABASE_URL: ${USER_MS_DATABASE_URL:-postgresql+psycopg2://postgres:change-this-db-password@mesoftx-db:5432/users_db}
      JWT_SECRET_KEY: ${USER_MS_JWT_SECRET_KEY:-change-this-jwt-secret-with-at-least-32-chars}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${USER_MS_JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${USER_MS_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${USER_MS_PORT:-8001}:8001"
    depends_on:
      mesoftx-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mesoftx_postgres_data:
