services:
  user-ms:
    build:
      context: ../..
      dockerfile: deployment/backend/User_MS/Dockerfile
    container_name: user-ms
    restart: unless-stopped
    environment:
      APP_NAME: User_MS
      APP_ENV: ${APP_ENV:-local}
      API_V1_PREFIX: /api/v1
      DATABASE_URL: ${USER_MS_DATABASE_URL:?Configure USER_MS_DATABASE_URL}
      JWT_SECRET_KEY: ${USER_MS_JWT_SECRET_KEY:?Configure USER_MS_JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${USER_MS_JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ASSESMENT_MS_URL: ${ASSESMENT_MS_URL:-http://assesment-ms:8002}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN es obligatorio; defínelo en deployment/backend/.env}
      CORS_ORIGINS: ${USER_MS_CORS_ORIGINS:-http://localhost:4200}
      # Modo exposición (sin login): apagado por defecto. DEMO_MODE=true solo en local/exposición.
      DEMO_MODE: ${DEMO_MODE:-false}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      INTEGRATIONS_PREVIOUS_KEYS: ${INTEGRATIONS_PREVIOUS_KEYS:-}
      EXTERNAL_API_ALLOWED_HOSTS: ${EXTERNAL_API_ALLOWED_HOSTS:-}
    ports:
      - "${USER_MS_PORT:-8001}:8001"
    networks:
      - mesoftx-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  assesment-ms:
    build:
      context: ../..
      dockerfile: deployment/backend/Assesment_MS/Dockerfile
    container_name: assesment-ms
    restart: unless-stopped
    # Assesment_MS depende de User_MS (paso 16.2): no arranca hasta que User_MS
    # responda /health. La base de datos (mesoftx-db) vive en deployment/db y
    # comparte la red externa mesoftx-network; debe estar healthy antes (ver nota).
    depends_on:
      user-ms:
        condition: service_healthy
    environment:
      APP_NAME: Assesment_MS
      APP_ENV: ${APP_ENV:-local}
      API_V1_PREFIX: /api/v1
      DATABASE_URL: ${ASSESMENT_MS_DATABASE_URL:?Configure ASSESMENT_MS_DATABASE_URL}
      JWT_SECRET_KEY: ${USER_MS_JWT_SECRET_KEY:?Configure USER_MS_JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      USER_MS_URL: ${USER_MS_URL:-http://user-ms:8001}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN es obligatorio; defínelo en deployment/backend/.env}
      CORS_ORIGINS: ${ASSESMENT_MS_CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "${ASSESMENT_MS_PORT:-8002}:8002"
    networks:
      - mesoftx-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  mesoftx-network:
    external: true
    name: mesoftx-network
