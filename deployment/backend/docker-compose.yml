services:
  user-ms:
    build:
      context: ../..
      dockerfile: deployment/backend/User_MS/Dockerfile
    container_name: user-ms
    restart: unless-stopped
    environment:
      APP_NAME: User_MS
      APP_ENV: container
      API_V1_PREFIX: /api/v1
      DATABASE_URL: ${USER_MS_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@mesoftx-db:5432/users_db}
      JWT_SECRET_KEY: ${USER_MS_JWT_SECRET_KEY:-change-this-jwt-secret-with-at-least-32-chars}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${USER_MS_JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      GOOGLE_CLIENT_ID: ${USER_MS_GOOGLE_CLIENT_ID:-replace-with-google-oauth-client-id.apps.googleusercontent.com}
      CORS_ORIGINS: ${USER_MS_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    ports:
      - "${USER_MS_PORT:-8001}:8001"
    networks:
      - mesoftx-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  assesment-ms:
    build:
      context: ../..
      dockerfile: deployment/backend/Assesment_MS/Dockerfile
    container_name: assesment-ms
    restart: unless-stopped
    environment:
      APP_NAME: Assesment_MS
      APP_ENV: container
      API_V1_PREFIX: /api/v1
      DATABASE_URL: ${ASSESMENT_MS_DATABASE_URL:-postgresql+psycopg2://postgres:postgres@mesoftx-db:5432/assesment_mesoftx_db}
      DOCUMENT_BASE_URL: ${ASSESMENT_MS_DOCUMENT_BASE_URL:-/app/documents/MESOFTX}
      DOCUMENT_SUPPORT_ASSESMENT: ${ASSESMENT_MS_DOCUMENT_SUPPORT_ASSESMENT:-/app/documents/MESOFTX/ASSESMENT}
      CORS_ORIGINS: ${ASSESMENT_MS_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    volumes:
      - ${ASSESMENT_MS_DOCUMENT_HOST_BASE_URL:-./documents/MESOFTX}:${ASSESMENT_MS_DOCUMENT_BASE_URL:-/app/documents/MESOFTX}
    ports:
      - "${ASSESMENT_MS_PORT:-8002}:8002"
    networks:
      - mesoftx-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  mesoftx-network:
    external: true
    name: mesoftx-network
