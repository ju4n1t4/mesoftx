services:
  mesoftx-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mesoftx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mesoftx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mesoftx_postgres_data:
