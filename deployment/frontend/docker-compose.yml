name: mesoftx-frontend

services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: mesoftx-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8083}:80"
    networks:
      - mesoftx-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  mesoftx-network:
    external: true
    name: mesoftx-network
