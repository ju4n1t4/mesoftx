server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy a User_MS desde environment.prod.ts: /user-api/v1
    location /user-api/ {
        proxy_pass http://user-ms:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy a Assesment_MS desde environment.prod.ts: /assesment-api/v1
    location /assesment-api/ {
        proxy_pass http://assesment-ms:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA: redirige las rutas del cliente a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estaticos.
    location ~* \.(js|css|png|jpg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
