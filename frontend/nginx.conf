# nginx de MESOFTX (producción). Sirve la SPA y hace de proxy a los dos microservicios.
# Los microservicios NO se publican al exterior: solo este nginx es accesible.
server_tokens off;
client_max_body_size 6m;          # los cargues masivos están limitados a 5 MB en el front

# HSTS solo se envía cuando la petición llegó por HTTPS (TLS termina en un proxy
# delante, p. ej. Azure Front Door / App Gateway, que añade X-Forwarded-Proto).
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Si el proxy TLS delante informa que la petición original era HTTP, se redirige a HTTPS.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/snippets/security-headers.conf;

    # El front solo habla con su propio origen (CSP connect-src 'self').
    # X-Forwarded-For se SOBRESCRIBE con la IP vista por nginx: los backends confían en
    # esa cabecera (TRUST_PROXY_HEADERS=true) para el límite de intentos y la auditoría,
    # y un cliente no debe poder falsearla. Si hay un proxy de confianza delante, configure
    # set_real_ip_from/real_ip_header para que $remote_addr sea la IP real del usuario.
    location /user-api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://user-ms:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location /assesment-api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://assesment-ms:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # Assets con hash de Angular: caché larga.
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: index.html nunca se cachea para que los despliegues se vean de inmediato.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
